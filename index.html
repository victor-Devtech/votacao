<style>
  html, body { margin: 0; height: 100%; background: #f3f3f7; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .carregando {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #100e34; transition: opacity .3s ease;
  }
  .carregando.some { opacity: 0; pointer-events: none; }
  .carregando span {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid rgba(255,191,24,.25); border-top-color: #ffbf18;
    animation: gira .8s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<iframe id="app" title="Votação de horário"
  src="https://script.google.com/macros/s/AKfycbzdGKSp-gQideUpT4E2pNYbp1fLTmSEU8L4NTZnunx0jSdwkzykc14KFWPX23tL9oSm/exec"></iframe>
<div class="carregando" id="carregando" aria-hidden="true"><span></span></div>
<script>
  document.getElementById('app').addEventListener('load', function () {
    document.getElementById('carregando').classList.add('some');
  });
</script>
</body>
