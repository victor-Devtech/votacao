<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultado da votação | Wanderley Construções</title>
<meta name="description" content="Acompanhe o resultado da votação da nova jornada de trabalho.">
<meta property="og:title" content="Resultado da votação | Wanderley Construções">
<meta property="og:description" content="Acompanhe o resultado da votação da nova jornada de trabalho.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#100e34">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f3f3f7; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .carregando {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #100e34; transition: opacity .3s ease;
  }
  .carregando.some { opacity: 0; pointer-events: none; }
  .carregando span {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid rgba(255,191,24,.25); border-top-color: #ffbf18;
    animation: gira .8s linear infinite;
  }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<iframe id="app" title="Resultado da votação"
  src="https://script.google.com/macros/s/AKfycbzdGKSp-gQideUpT4E2pNYbp1fLTmSEU8L4NTZnunx0jSdwkzykc14KFWPX23tL9oSm/exec?relatorio=wdly-horario-8k3p9x"></iframe>
<div class="carregando" id="carregando" aria-hidden="true"><span></span></div>
<script>
  function esconder() { document.getElementById('carregando').classList.add('some'); }
  document.getElementById('app').addEventListener('load', esconder);
  setTimeout(esconder, 5000); // nunca deixa o carregamento travado na tela
</script>
</body>
</html>
